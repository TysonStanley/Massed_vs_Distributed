<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speech Perception Study</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/css/jspsych.css"
        integrity="sha384-F1pvd1ZCaxuJalclhLrJj8A5LWkFVuFinaHeIgOZXnnCGt7HAbSPzTw7fO3qeJ8F"
        crossorigin="anonymous">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: #000;
      color: #fff;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
    }

    /* Override jsPsych defaults */
    .jspsych-display-element { background: #000 !important; }
    .jspsych-content-wrapper  { background: #000 !important; }
    .jspsych-content          { max-width: 860px; background: #000; color: #fff; }
    .jspsych-btn {
      background: #1a1a1a !important;
      color: #fff !important;
      border: 1px solid #555 !important;
      padding: 10px 22px !important;
      font-size: 1em !important;
      font-family: 'Courier New', monospace !important;
      cursor: pointer !important;
      transition: background 0.15s;
    }
    .jspsych-btn:hover { background: #333 !important; }

    /* Button group layout: stack vertically for multi-option questions */
    .jspsych-html-button-response-btngroup {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      margin-top: 32px;
    }
    .jspsych-html-button-response-btngroup button {
      width: 320px;
      text-align: left;
      padding: 10px 16px !important;
    }

    /* Experiment text elements */
    .exp-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 60px 30px 40px;
      text-align: center;
    }
    .exp-text {
      font-size: 1.15em;
      line-height: 1.75;
      color: #fff;
      white-space: pre-wrap;
    }
    .exp-prompt {
      font-size: 1.2em;
      line-height: 1.6;
      color: #fff;
      margin-bottom: 10px;
    }
    .exp-subtitle {
      font-size: 1.3em;
      color: #fff;
      line-height: 1.6;
      padding: 20px;
    }
    .exp-hint {
      font-size: 0.88em;
      color: #666;
      margin-top: 30px;
    }
    .exp-hint-error { color: #f77; }
    .exp-input {
      display: block;
      width: 70%;
      margin: 24px auto 0;
      background: #0d0d0d;
      color: #ffe066;
      border: 1px solid #444;
      font-size: 1.2em;
      font-family: 'Courier New', monospace;
      padding: 12px 16px;
      text-align: center;
      outline: none;
    }
    .exp-input:focus { border-color: #ffe066; }

    .fixation {
      font-size: 5em;
      color: #fff;
      text-align: center;
      line-height: 1;
      margin: 24px auto 0;
    }

    /* Setup screen (pre-jsPsych) */
    #setup-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .setup-box { width: 380px; }
    .setup-box h2 { text-align: center; margin-bottom: 28px; letter-spacing: 1px; }
    .setup-box label {
      display: block;
      font-size: 0.85em;
      color: #aaa;
      margin-bottom: 4px;
      margin-top: 16px;
    }
    .setup-box input,
    .setup-box select {
      width: 100%;
      padding: 9px 12px;
      background: #111;
      color: #fff;
      border: 1px solid #444;
      font-size: 1em;
      font-family: 'Courier New', monospace;
      outline: none;
    }
    .setup-box input:focus,
    .setup-box select:focus { border-color: #ffe066; }
    .setup-box .setup-btn {
      display: block;
      width: 100%;
      margin-top: 28px;
      padding: 11px;
      background: #1a1a1a;
      color: #fff;
      border: 1px solid #666;
      font-size: 1em;
      font-family: 'Courier New', monospace;
      cursor: pointer;
      letter-spacing: 1px;
    }
    .setup-box .setup-btn:hover { background: #2a2a2a; }
    .setup-error { color: #f77; font-size: 0.85em; margin-top: 8px; min-height: 18px; }
    .setup-loading { text-align: center; color: #888; font-size: 0.9em; margin-top: 12px; }
  </style>
</head>
<body>

<div id="setup-screen"></div>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"
        integrity="sha384-D/t0ZMqQW31H3az8ktEiNb39wyKnS82iFY52QPACM+IjKW3jDUhyIgh2PApRqJZs"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jspsych@7.3.4/dist/index.browser.js"
        integrity="sha384-tdxSQG8C+Ow23LQDLbyVuEjQC7NWeRoWlxk8WnfH7351rA9Pt+jD62urHc/fCuSc"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-keyboard-response@1.1.3/dist/index.browser.js"
        integrity="sha384-GqDAeoGeuvDnnWtpRBE9Z4F26aoFpvVGk8zPB30qakyVINvnDGnMfQ5aSIeT8xAL"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-audio-keyboard-response@1.1.3/dist/index.browser.js"
        integrity="sha384-pvoiZs73iizAB5y+F2Syn1hzCFl5qu61UyztPuBQpAW+u5NIvDXXeoLOCWaT1yZ3"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@jspsych/plugin-html-button-response@1.1.3/dist/index.browser.js"
        integrity="sha384-qsg2mx9U69P31mwgsvmU5S0UvjVGvT5l1rjcMvKTu5FlxXdSkp0mlvqnZv/GFvrU"
        crossorigin="anonymous"></script>
<script src="experiment.js"></script>
</body>
</html>
